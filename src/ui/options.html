<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenMeetRec — settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Settings</h1>

      <fieldset>
        <legend>Transcription</legend>

        <label for="provider">Provider</label>
        <select id="provider"></select>

        <label for="model">Model</label>
        <select id="model"></select>
        <input id="model-custom" type="text" placeholder="model id" hidden />

        <label for="api-key">API key</label>
        <input id="api-key" type="password" autocomplete="off" spellcheck="false" />
        <p class="hint" id="key-hint"></p>
        <button id="test-key" type="button">Test key</button>
        <span id="test-result" class="hint"></span>
      </fieldset>

      <fieldset id="custom-fields" hidden>
        <legend>Custom endpoint</legend>
        <label for="custom-endpoint">URL (HTTPS)</label>
        <input id="custom-endpoint" type="url" placeholder="https://…/v1/audio/transcriptions" />
        <label class="check"><input type="checkbox" id="custom-segments" /> Returns timestamped segments</label>
        <label class="check"><input type="checkbox" id="custom-diarization" /> Does speaker diarization</label>
        <p class="hint">
          A custom endpoint requires an extra network access permission,
          requested when you save.
        </p>
      </fieldset>

      <fieldset>
        <legend>Output</legend>
        <label class="check"><input type="checkbox" id="diarize" /> Identify speakers</label>
        <p class="hint" id="diarize-hint"></p>
        <label class="check"><input type="checkbox" id="download-audio" /> Also download the audio</label>
        <label for="language">Language</label>
        <input id="language" type="text" placeholder="auto" size="8" />
        <p class="hint">ISO code (en, fr…); empty = automatic detection.</p>
      </fieldset>

      <div class="actions">
        <button id="save" type="button">Save</button>
        <span id="status" class="hint"></span>
      </div>

      <ul id="problems" class="problems"></ul>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
