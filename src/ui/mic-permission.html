<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenMeetRec — microphone permission</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main style="width: 420px">
      <h1>Allow microphone access</h1>
      <p>
        Recording happens in a document internal to the extension, which cannot
        show the permission prompt itself. Click below and accept the browser's
        request: the permission is then valid for all your sessions.
      </p>
      <button id="grant" type="button">Request microphone access</button>
      <p id="result" class="status"></p>
    </main>
    <script type="module" src="mic-permission.js"></script>
  </body>
</html>
